name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/library-app

jobs:
  # ---------------- 1. Проверка кода ----------------
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install flake8==7.1.1
      - run: flake8 app tests

  # ---------------- 2. Автотесты (на реальном PostgreSQL) ----------------
  test:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: library_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/library_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests on PostgreSQL
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Run tests on SQLite
        run: TEST_DATABASE_URL= python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  # ---------------- 3. Сборка образа и проверка развертывания ----------------
  build:
    name: Build & integration test (Docker Compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_$(openssl rand -hex 12)/" .env
          sed -i "s/^GRAFANA_PASSWORD=.*/GRAFANA_PASSWORD=ci_$(openssl rand -hex 12)/" .env
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start
        run: ./scripts/start.sh
      - name: Smoke test
        run: ./scripts/smoke_test.sh
      - name: Seed, backup and restore check
        run: |
          ./scripts/seed.sh
          ./scripts/backup.sh
          ./scripts/restore.sh
      - name: Failure simulation
        run: ./scripts/simulate_failure.sh
      - name: Security check
        run: ./scripts/security_check.sh || true
      - name: Container status and logs
        if: always()
        run: |
          ./scripts/status.sh || true
          ./scripts/analyze_logs.sh 1h || true
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: library-app:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Stop
        if: always()
        run: docker compose down -v

  # ---------------- 4. Публикация образа (CD) ----------------
  deliver:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
